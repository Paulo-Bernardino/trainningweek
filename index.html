<!DOCTYPE html>
<html lang="pt-br" class="bg-[#0D0E14] antialiased">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRAINN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .task-check:checked + .task-text, .task-check:checked + .task-text * {
            text-decoration: line-through;
            opacity: 0.5;
            color: #A855F7;
        }
        .tab-button.active {
            background-color: #A855F7;
            color: white;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }
        /* Efeito de riscar TUDO dentro do label quando o checkbox for marcado */
.task-check:checked ~ .task-text,
.task-check:checked ~ .task-text strong,
.task-check:checked ~ .task-text span,
.task-check:checked ~ .task-text .kcal-tag {
    text-decoration: line-through;
    opacity: 0.4;
    color: #A855F7 !important; /* Cor violeta suave ao riscar */
    transition: all 0.3s ease;
}

/* Estilo para as tags de calorias por exercício */
.kcal-tag {
    background: rgba(168, 85, 247, 0.1);
    border: 1px solid rgba(168, 85, 247, 0.2);
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 800;
    color: #A855F7;
}
    </style>
</head>
<body class="text-white font-sans p-4 pb-32">
    <main class="max-w-xl mx-auto">
        <header class="text-center mb-8 pt-4">
            <h1 class="text-4xl font-black bg-gradient-to-r from-violet-400 to-cyan-300 bg-clip-text text-transparent italic tracking-tighter">TRAINN</h1>
        </header>

        <div class="flex justify-center mb-10">
            <div class="relative w-44 h-44 drop-shadow-[0_0_25px_rgba(168,85,247,0.2)]">
                <svg class="transform -rotate-90" width="176" height="176" viewBox="0 0 160 160">
                    <circle cx="80" cy="80" r="70" stroke="#1A1B24" stroke-width="10" fill="none" />
                    <circle id="caloriesRing" cx="80" cy="80" r="70" stroke="#A855F7" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="440" stroke-dashoffset="440" style="transition: stroke-dashoffset 1s ease;"></circle>
                </svg>
                <div class="absolute inset-0 flex items-center justify-center flex-col">
                    <span class="text-4xl font-black" id="totalCalorias">0</span>
                    <span class="text-[10px] text-gray-500 uppercase font-bold mt-1">kcal Total</span>
                </div>
            </div>
        </div>

        <nav class="flex justify-around bg-[#1A1B24]/50 backdrop-blur-md p-1.5 rounded-2xl mb-8 border border-white/5 sticky top-4 z-40">
            <button id="tabTraining" class="tab-button active flex-1 py-3 px-2 text-center text-xs font-black rounded-xl transition-all">
                <i class="fas fa-dumbbell mb-1 block text-lg"></i> TREINO
            </button>
            <button id="tabDiet" class="tab-button flex-1 py-3 px-2 text-center text-xs font-black rounded-xl text-gray-500 transition-all">
                <i class="fas fa-utensils mb-1 block text-lg"></i> DIETA
            </button>
            <button id="tabPhysical" class="tab-button flex-1 py-3 px-2 text-center text-xs font-black rounded-xl text-gray-500 transition-all">
                <i class="fas fa-chart-line mb-1 block text-lg"></i> FÍSICO
            </button>
        </nav>

        <div id="contentTraining" class="space-y-6">
            <div class="bg-[#1A1B24] p-5 rounded-3xl border border-white/5 shadow-2xl">
                <select id="daySelect" class="w-full bg-[#0D0E14] border border-white/10 text-white px-5 py-4 rounded-2xl text-lg font-bold appearance-none outline-none"></select>
            </div>
            <div id="dayContent" class="space-y-3"></div>
        </div>

        <div id="contentDiet" class="hidden space-y-6">
            <div class="flex bg-[#1A1B24] p-1.5 rounded-2xl border border-white/5">
                <button id="btnDietOn" onclick="renderDiet('ON')" class="flex-1 py-3 rounded-xl font-black text-xs">DIETA ON</button>
                <button id="btnDietOff" onclick="renderDiet('OFF')" class="flex-1 py-3 rounded-xl font-black text-xs text-gray-500">DIETA OFF</button>
            </div>
            <div id="dietContainer" class="space-y-3"></div>
        </div>

        <div id="contentPhysical" class="hidden space-y-6">
            <form id="physicalForm" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-[#1A1B24] p-4 rounded-2xl border border-white/5">
                        <label class="block text-[10px] text-gray-500 mb-1 uppercase font-bold">Peso (kg)</label>
                        <input type="number" id="weight" class="bg-transparent w-full text-2xl font-black outline-none text-violet-400" placeholder="00">
                    </div>
                    <div class="bg-[#1A1B24] p-4 rounded-2xl border border-white/5">
                        <label class="block text-[10px] text-gray-500 mb-1 uppercase font-bold">Altura (cm)</label>
                        <input type="number" id="height" class="bg-transparent w-full text-2xl font-black outline-none text-violet-400" placeholder="000">
                    </div>
                    <div class="bg-[#1A1B24] p-4 rounded-2xl border border-white/5">
                        <label class="block text-[10px] text-gray-500 mb-1 uppercase font-bold">Idade</label>
                        <input type="number" id="age" class="bg-transparent w-full text-2xl font-black outline-none text-violet-400" placeholder="00">
                    </div>
                    <div class="bg-[#1A1B24] p-4 rounded-2xl border border-white/5">
                        <label class="block text-[10px] text-gray-500 mb-1 uppercase font-bold">Gênero</label>
                        <select id="gender" class="bg-transparent w-full text-lg font-black outline-none text-violet-400">
                            <option value="male">Masculino</option>
                            <option value="female">Feminino</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="w-full bg-violet-600 p-5 rounded-2xl font-black uppercase tracking-widest shadow-lg shadow-violet-500/20 active:scale-95 transition-all">Atualizar Metabolismo</button>
            </form>

            <div id="bmrResult" class="hidden p-8 bg-gradient-to-br from-[#1A1B24] to-black rounded-3xl border border-violet-500/30 text-center">
                <p class="text-[10px] uppercase font-bold text-gray-400 mb-2">Seu Basal (TMB)</p>
                <div class="text-5xl font-black text-cyan-400" id="bmrValue">0</div>
                <p class="text-xs text-gray-500 mt-4 italic">Calorias que seu corpo queima em repouso.</p>
            </div>
        </div>
    </main>

    <footer class="fixed bottom-6 left-4 right-4 max-w-xl mx-auto z-50">
        <div class="bg-[#1A1B24]/90 backdrop-blur-2xl p-4 rounded-[2.5rem] border border-white/10 shadow-2xl flex items-center justify-between">
            <div id="currentSongInfo" class="ml-4"><p class="text-xs font-black uppercase">Treino TRAINN</p></div>
            <button id="playPauseButton" class="bg-white text-black w-12 h-12 rounded-full flex items-center justify-center transition-all active:scale-90"><i class="fas fa-play" id="playPauseIcon"></i></button>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
