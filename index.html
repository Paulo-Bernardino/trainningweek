<!DOCTYPE html>
<html lang="pt-br" class="bg-[#0D0E14] antialiased">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRAINN | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .task-check:checked ~ .task-text strong,
        .task-check:checked ~ .task-text span,
        .task-check:checked ~ .task-text .kcal-tag {
            text-decoration: line-through;
            opacity: 0.4;
            color: #A855F7 !important;
        }
        .tab-button.active {
            background-color: #A855F7;
            color: white;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }
        .kcal-tag {
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.2);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 800;
            color: #A855F7;
        }
        /* Animação suave para modais */
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-white font-sans p-4 pb-32">
    <main class="max-w-xl mx-auto">
        
        <div class="flex justify-between items-center mb-6 bg-[#1A1B24]/30 p-3 rounded-2xl border border-white/5">
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                <span class="text-[10px] font-black text-gray-400 uppercase tracking-widest">
                    Bem-vindo, <span id="top-username" class="text-violet-400">Usuário</span>
                </span>
            </div>
            <button onclick="logout()" class="text-[10px] font-black text-gray-500 hover:text-red-400 transition-colors uppercase tracking-widest flex items-center gap-2">
                Sair <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>

        <header class="text-center mb-8">
            <h1 class="text-4xl font-black bg-gradient-to-r from-violet-400 to-cyan-300 bg-clip-text text-transparent italic tracking-tighter">TRAINN</h1>
            <p id="welcome-msg" class="text-[10px] text-gray-500 uppercase font-bold tracking-[0.2em] mt-2"></p>
        </header>

        <div class="flex justify-center mb-10">
            <div class="relative w-44 h-44 drop-shadow-[0_0_25px_rgba(168,85,247,0.2)]">
                <svg class="transform -rotate-90" width="176" height="176" viewBox="0 0 160 160">
                    <circle cx="80" cy="80" r="70" stroke="#1A1B24" stroke-width="10" fill="none" />
                    <circle id="caloriesRing" cx="80" cy="80" r="70" stroke="#A855F7" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="440" stroke-dashoffset="440" style="transition: stroke-dashoffset 1s ease;"></circle>
                </svg>
                <div class="absolute inset-0 flex items-center justify-center flex-col">
                    <span class="text-4xl font-black" id="totalCalorias">0</span>
                    <span class="text-[10px] text-gray-500 uppercase font-bold mt-1">kcal Total</span>
                </div>
            </div>
        </div>

        <nav class="flex justify-around bg-[#1A1B24]/50 backdrop-blur-md p-1.5 rounded-2xl mb-8 border border-white/5 sticky top-4 z-40">
            <button id="tabTraining" class="tab-button active flex-1 py-3 px-2 text-center text-xs font-black rounded-xl transition-all">
                TREINO
            </button>
            <button id="tabDiet" class="tab-button flex-1 py-3 px-2 text-center text-xs font-black rounded-xl text-gray-500 transition-all">
                DIETA
            </button>
            <button id="tabPhysical" class="tab-button flex-1 py-3 px-2 text-center text-xs font-black rounded-xl text-gray-500 transition-all">
                FÍSICO
            </button>
        </nav>

        <div id="contentTraining" class="space-y-6">
            <div class="bg-[#1A1B24] p-5 rounded-3xl border border-white/5 shadow-2xl">
                <select id="daySelect" class="w-full bg-[#0D0E14] border border-white/10 text-white px-5 py-4 rounded-2xl text-lg font-bold appearance-none outline-none"></select>
            </div>
            <div id="dayContent" class="space-y-3"></div>
        </div>

        <div id="contentDiet" class="hidden space-y-6">
            <button onclick="openDietModal()" class="w-full py-4 bg-violet-600/10 border border-violet-500/20 rounded-2xl text-violet-400 font-black text-xs uppercase tracking-widest">
                <i class="fas fa-plus mr-2"></i> Adicionar Item
            </button>

            <div class="flex bg-[#1A1B24] p-1.5 rounded-2xl border border-white/5">
                <button id="btnDietOn" onclick="renderDiet('ON')" class="flex-1 py-3 rounded-xl font-black text-xs">DIETA ON</button>
                <button id="btnDietOff" onclick="renderDiet('OFF')" class="flex-1 py-3 rounded-xl font-black text-xs">DIETA OFF</button>
            </div>
            <div id="dietContainer" class="space-y-3"></div>
        </div>

        <div id="contentPhysical" class="hidden space-y-6">
            <form id="physicalForm" class="space-y-4" onsubmit="event.preventDefault(); saveAndCalculatePhysical();">
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-[#1A1B24] p-4 rounded-2xl border border-white/5">
                        <label class="block text-[10px] text-gray-500 mb-1 uppercase font-bold">Peso (kg)</label>
                        <input type="number" id="weight" class="bg-transparent w-full text-2xl font-black outline-none text-violet-400" placeholder="00">
                    </div>
                    <div class="bg-[#1A1B24] p-4 rounded-2xl border border-white/5">
                        <label class="block text-[10px] text-gray-500 mb-1 uppercase font-bold">Altura (cm)</label>
                        <input type="number" id="height" class="bg-transparent w-full text-2xl font-black outline-none text-violet-400" placeholder="000">
                    </div>
                    <div class="bg-[#1A1B24] p-4 rounded-2xl border border-white/5">
                        <label class="block text-[10px] text-gray-500 mb-1 uppercase font-bold">Idade</label>
                        <input type="number" id="age" class="bg-transparent w-full text-2xl font-black outline-none text-violet-400" placeholder="00">
                    </div>
                    <div class="bg-[#1A1B24] p-4 rounded-2xl border border-white/5">
                        <label class="block text-[10px] text-gray-500 mb-1 uppercase font-bold">Gênero</label>
                        <select id="gender" class="bg-transparent w-full text-lg font-black outline-none text-violet-400">
                            <option value="male">Masculino</option>
                            <option value="female">Feminino</option>
                        </select>
                    </div>
                </div>
                <div class="bg-[#1A1B24] p-4 rounded-2xl border border-white/5">
                    <label class="block text-[10px] text-gray-500 mb-1 uppercase font-bold">Objetivo</label>
                    <select id="userGoal" class="bg-transparent w-full text-lg font-black outline-none text-cyan-400">
                        <option value="hipertrofia">Hipertrofia</option>
                        <option value="emagrecimento">Emagrecimento</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-violet-600 p-5 rounded-2xl font-black uppercase tracking-widest">Atualizar Perfil</button>
            </form>
            <div id="bmrResult" class="hidden p-8 bg-[#1A1B24] rounded-3xl border border-violet-500/30 text-center">
                <p class="text-[10px] uppercase font-bold text-gray-400 mb-2">Seu Basal (TMB)</p>
                <div class="text-5xl font-black text-cyan-400" id="bmrValue">0</div>
            </div>
        </div>
    </main>

    <div id="dietModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-[100] hidden items-center justify-center p-6">
        <div class="bg-[#1A1B24] w-full max-w-md rounded-[2rem] p-8 border border-white/10">
            <h2 class="text-xl font-black italic mb-6 text-violet-400">NOVO ITEM</h2>
            <form id="dietForm" class="space-y-4">
                <select id="modalItemType" class="w-full bg-black/40 border border-white/10 rounded-xl p-4 text-white outline-none" onchange="this.value === 'Suplemento' ? document.getElementById('linkContainer').classList.remove('hidden') : document.getElementById('linkContainer').classList.add('hidden')">
                    <option value="Alimento">Alimento</option>
                    <option value="Suplemento">Suplemento</option>
                </select>
                <input type="text" id="modalItemName" placeholder="Nome" class="w-full bg-black/40 border border-white/10 rounded-xl p-4 text-white outline-none">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="modalItemQty" placeholder="Qtd (ex: 200g)" class="w-full bg-black/40 border border-white/10 rounded-xl p-4 text-white outline-none">
                    <input type="time" id="modalItemTime" class="w-full bg-black/40 border border-white/10 rounded-xl p-4 text-white outline-none">
                </div>
                <div id="linkContainer" class="hidden">
                    <input type="url" id="modalItemLink" placeholder="Link de Compra (https://...)" class="w-full bg-black/40 border border-cyan-500/30 rounded-xl p-4 text-white outline-none">
                </div>
                <div class="flex gap-3 mt-4">
                    <button type="button" onclick="closeDietModal()" class="flex-1 py-4 bg-gray-800 rounded-2xl font-black text-xs uppercase">Cancelar</button>
                    <button type="button" onclick="saveNewDietItem()" class="flex-1 py-4 bg-violet-600 rounded-2xl font-black text-xs uppercase">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="fixed bottom-6 left-4 right-4 max-w-xl mx-auto z-50">
        <div class="bg-[#1A1B24]/90 backdrop-blur-2xl p-4 rounded-[2.5rem] border border-white/10 flex items-center justify-between shadow-2xl">
            <div class="ml-4">
                <p id="songTitle" class="text-xs font-black uppercase text-white">Treino Ativo</p>
                <p class="text-[9px] text-gray-500 uppercase font-bold">Radio Meet Phonk</p>
            </div>
            <button id="playPauseButton" class="bg-white text-black w-12 h-12 rounded-full flex items-center justify-center">
                <i class="fas fa-play" id="playPauseIcon"></i>
            </button>
        </div>
    </footer>

    <script>
        const scriptToLoad = localStorage.getItem('userScript');
        const userName = localStorage.getItem('userName');

        if (!scriptToLoad) {
            window.location.href = 'login.html';
        } else {
            const formattedName = userName ? userName.toUpperCase() : 'USUÁRIO';
            document.getElementById('top-username').innerText = formattedName;
            document.getElementById('welcome-msg').innerText = `WORKOUT: ${formattedName}`;

            const scriptTag = document.createElement('script');
            scriptTag.src = scriptToLoad; 
            scriptTag.onload = () => { if (typeof init === 'function') init(); };
            document.body.appendChild(scriptTag);
        }

        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
    </script>
</body>
</html>
