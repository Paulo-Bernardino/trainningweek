<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRAINN | Login Premium</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(to right, #A855F7, #67E8F9); /* Violeta para Cyan */
            --bg-dark: #0D0E14;
            --card-bg: #1A1B24;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .login-card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        /* Estilo fiel ao seu Dashboard */
        .logo-text {
            font-size: 2.5rem;
            font-weight: 900;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-style: italic;
            letter-spacing: -0.05em;
            margin-bottom: 0.5rem;
            display: block;
        }

        p { color: #64748b; margin-bottom: 2rem; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; }

        .input-group { margin-bottom: 1.2rem; text-align: left; }
        label { display: block; margin-bottom: 0.5rem; color: #94a3b8; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #0D0E14;
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #A855F7;
            box-shadow: 0 0 0 1px #A855F7;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #A855F7; /* Violeta sólido para o botão */
            color: white;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 1rem;
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 20px -10px rgba(168, 85, 247, 0.5);
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.75rem;
            font-weight: 700;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <span class="logo-text">TRAINN</span>
        <p>Acesso Exclusivo</p>

        <form id="loginForm">
            <div class="input-group">
                <label>Usuário</label>
                <input type="text" id="username" placeholder="Seu usuário" required autocomplete="off">
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit">Entrar</button>
            <div id="error" class="error-msg">Dados incorretos. Tente novamente.</div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('error');

            // MOCK DE USUÁRIOS CONFORME SOLICITADO
            const users = {
                'paulo_rocha': { pass: 'Paulo689', script: 'app.js' },
                'juliana_rocha': { pass: 'Juliana1996', script: 'app2.js' }
            };

            if (users[user] && users[user].pass === pass) {
                // Salva os dados para o Index/Dashboard usar
                localStorage.setItem('userScript', users[user].script);
                localStorage.setItem('userName', user);
                
                // Redireciona para o seu arquivo principal
                window.location.href = 'index.html'; 
            } else {
                errorMsg.style.display = 'block';
                // Efeito vibrar no erro (opcional)
                document.querySelector('.login-card').animate([
                    { transform: 'translateX(0)' },
                    { transform: 'translateX(-5px)' },
                    { transform: 'translateX(5px)' },
                    { transform: 'translateX(0)' }
                ], { duration: 200 });
            }
        });
    </script>
</body>
</html>
